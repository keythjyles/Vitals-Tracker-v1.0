<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101924"><meta name="description" content="Select a joke and carry its project through the Grill Sergeant production tools."><title>GS Studio · GS-TOOL-STUDIO · R1</title><link rel="manifest" href="app.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="studio.css?v=1"></head><body>
<header id="appBar"><button id="chooseJoke" aria-label="Select a different joke">GS</button><strong id="jokeTitle">Select a joke</strong><button id="saveWork" disabled>Save</button><button id="assets" disabled>Assets</button><button id="install" hidden>Install app</button><button id="nextPhase" disabled>Next phase ›</button></header>
<nav id="phases" aria-label="Production phases"><button data-phase="joke" aria-current="page">Joke</button><button data-phase="cut" disabled>Cut</button><button data-phase="captions" disabled>Captions</button><button data-phase="scene" disabled>Scene</button><button data-phase="sound" disabled>Sound</button><button data-phase="review" disabled>Review</button></nav>
<p id="saveState" role="status">GS Studio · R1 · Choose a joke to begin.</p>
<main id="workspace"><section id="entrance"><div class="entryTools"><h1>Select a joke</h1><button id="resume">Resume a saved joke</button></div><iframe id="jokeSelector" title="JokeLab joke selector" src="../jokelab/?studio=1" allow="clipboard-write"></iframe></section>
<section id="jokeWorkspace" hidden><form id="jokeForm"><label>Joke name<input id="title" maxlength="200" required></label><label>Joke text<textarea id="text" rows="4" required></textarea></label><label>Caption phrases · one independent screen per line<textarea id="phrases" rows="5"></textarea></label><label>Scribe<textarea id="scribe" rows="3"></textarea></label><div class="actions"><button id="saveJoke" type="submit">Save joke</button><button id="develop" type="button">Develop in JokeLab</button><button id="openGemini" type="button">Gemini captions ↗</button></div><p id="geminiNote">Gemini opens separately. Import its completed animation into this joke; automatic creative handback remains in development.</p></form><section id="jokeAssets"><h2>This joke’s assets</h2><div class="importRow"><select id="assetRole" aria-label="Asset role"><option value="caption">Caption animation</option><option value="bed">Bed video</option><option value="voice">Voice</option><option value="reaction">Reaction</option><option value="animation">Other animation</option><option value="sound">Sound effect</option><option value="music">Music / ambience</option><option value="image">Image</option><option value="outro">Outro</option><option value="broll">B-roll</option><option value="review">Review export</option></select><button id="importAsset">Import into joke</button><input id="assetFile" type="file" hidden accept="video/*,audio/*,image/*"></div><div id="assetList"></div></section></section>
<section id="moduleHost" hidden></section></main>
<dialog id="errorDialog"><h2>Work kept open</h2><p id="errorText"></p><button id="closeError">Keep editing</button></dialog>
<script type="module" src="studio.mjs?v=1"></script></body></html>
