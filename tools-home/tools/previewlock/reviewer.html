<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PreviewLock · R08</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;background:#0c131d;color:#e5edf6;font:14px system-ui}button,input{font:inherit}button{background:#243447;border:1px solid #3a536c;color:#e5edf6;border-radius:6px;padding:6px 10px;cursor:pointer}button:disabled{opacity:.4}input{background:#111e2c;color:white;border:1px solid #456078;border-radius:5px;padding:5px}header{position:sticky;top:0;z-index:4;background:#101c2a;border-bottom:1px solid #33485c;padding:5px 9px}#top{display:flex;align-items:center;gap:7px;white-space:nowrap;height:32px;font-size:12px}#top label{display:flex;align-items:center;gap:3px}#fps{width:42px}#frame{width:65px}#clock{margin-left:auto;font-variant-numeric:tabular-nums;font-size:11px}#toggle{padding:3px 6px;min-width:27px;font-size:13px}.dot{width:7px;height:7px;border-radius:50%;background:#e6b742;flex:none}.dot.green{background:#40cc86}.dot.red{background:#e96363}#version{font-size:9px;color:#7e99af}video{width:100%;max-height:38vh;display:block;background:#000;object-fit:contain}#fileName{font-size:11px;color:#9fb3c7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 0}.transport{display:flex;gap:4px;margin-top:3px}.transport button{flex:1;padding:6px 2px;font-size:13px;min-height:34px}.actions{display:flex;gap:4px;margin-top:4px}.actions button{flex:1;padding:5px 2px;font-size:11px}main{padding:10px;max-width:760px;margin:auto}section{border-bottom:1px solid #27394b;padding:10px 0}h2{font-size:14px;font-weight:600;margin:0 0 8px}article{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #233549;padding:8px 0}article span{overflow-wrap:anywhere;min-width:0}article button{white-space:nowrap}#rename{display:flex;gap:5px;align-items:center}#rename input{min-width:0;flex:1}#file{width:100%;font-size:12px}details{color:#a7bbcb}summary{cursor:pointer;padding:8px 0}#settingsContent{padding:8px 0}#settingsContent input{width:100%;margin:6px 0}#message,#settingMessage{font-size:12px;color:#a8bdcc}#connectionLabel{font-size:10px;color:#b7c6d4}#connectionLabel:empty{display:none}#renameStatus{font-size:11px;color:#a8bdcc}
</style></head><body><header><div id="top"><span id="dot" class="dot"></span><button id="toggle" aria-label="Connect or disconnect">⏳</button><label>FPS<input id="fps" type="number" min="1" max="120" value="25"></label><label>F<input id="frame" type="number" min="0" value="0"></label><span id="clock">0:00.000</span><span id="version">R08</span></div><video id="player" controls playsinline preload="metadata"></video><div id="fileName"></div><div class="transport"><button id="minus5">−5</button><button id="minus1">−1</button><button id="play">▶</button><button id="stop">■</button><button id="plus1">+1</button><button id="plus5">+5</button></div><div class="actions"><button id="sx">SxLock</button><button id="wav">WavLock</button><button id="download" disabled>↓ MP4</button></div></header><main><section><h2>Library <span id="count"></span></h2><div id="list"></div><div id="message" role="status"></div></section><section id="renameSection" hidden><h2>Filename</h2><div id="rename"><input id="renameInput" aria-label="Filename"><button id="saveName">Save</button></div><div id="renameStatus"></div></section><section><h2>Import</h2><input id="file" type="file" accept="video/mp4"><button id="upload">Upload</button><div id="uploadStatus" role="status"></div></section><details id="settings"><summary>⚙ Settings</summary><div id="settingsContent"><button id="unlock">Unlock connection settings</button><div id="editor" hidden><input id="keyInput" type="password" placeholder="Setup key" autocomplete="off"><button id="saveKey">Save & connect</button></div><div id="settingMessage" role="status"></div></div></details></main><script>
const API='https://gs-previewlock-api.onrender.com', $=x=>document.getElementById(x);let key=localStorage.getItem('gs_previewlock_key')||'',path='',url='',request=null,connected=false;const v=$('player');
function signal(mode){$('dot').className='dot '+(mode==='online'?'green':mode==='offline'?'red':'');$('toggle').textContent=mode==='online'?'⏻':mode==='offline'?'↻':'×';$('toggle').title=mode==='online'?'Disconnect':mode==='offline'?'Connect':'Cancel';$('toggle').setAttribute('aria-label',$('toggle').title)}
async function api(endpoint,opt={}){const r=await fetch(API+endpoint,{...opt,headers:{Authorization:'Bearer '+key,...opt.headers},signal:opt.signal});const data=await r.json();if(!r.ok)throw Error(data.error||'HTTP '+r.status);return data}
async function load(){if(!key){signal('offline');$('message').textContent='Open Settings to connect.';return}request=new AbortController();signal('busy');$('message').textContent='Loading…';try{const data=await api('/api/assets',{signal:request.signal});if(!key)return;connected=true;signal('online');const files=(data.entries||[]).filter(f=>f['.tag']==='file'&&/\.mp4$/i.test(f.name));$('count').textContent='· '+files.length;$('list').replaceChildren();for(const f of files){const row=document.createElement('article'),name=document.createElement('span'),b=document.createElement('button');name.textContent=f.name;b.textContent='▶';b.setAttribute('aria-label','Play '+f.name);b.onclick=()=>select(f);row.append(name,b);$('list').append(row)}$('message').textContent=files.length?'':'No MP4 files';}catch(e){if(e.name==='AbortError')return;connected=false;signal('offline');$('message').textContent='Connection failed: '+e.message}finally{request=null}}
async function select(f){path=f.path_display;$('fileName').textContent=f.name;$('renameSection').hidden=false;$('renameInput').value=f.name;$('download').disabled=false;try{$('fileName').textContent='Loading '+f.name+'…';const d=await api('/api/playback?path='+encodeURIComponent(path));url=d.url;v.src=url;$('fileName').textContent=f.name;v.play().catch(()=>{})}catch(e){$('fileName').textContent='Playback error: '+e.message}}
$('toggle').onclick=()=>{if(request){request.abort();request=null;signal('offline');$('message').textContent='Canceled';return}if(connected){connected=false;key='';localStorage.removeItem('gs_previewlock_key');v.pause();signal('offline');$('message').textContent='Disconnected';return}if(key)load();else{$('settings').open=true;$('editor').hidden=false;$('settingMessage').textContent='Enter setup key to connect.'}};
$('unlock').onclick=()=>{if(key){const check=prompt('Current setup key');if(check===null)return;if(check!==key){$('settingMessage').textContent='Incorrect key';return}}$('editor').hidden=false;$('settingMessage').textContent=''};
$('saveKey').onclick=async()=>{const candidate=$('keyInput').value.trim();if(!candidate)return;$('saveKey').disabled=true;key=candidate;await load();if(connected){localStorage.setItem('gs_previewlock_key',candidate);$('editor').hidden=true;$('settings').open=false;$('keyInput').value=''}else $('settingMessage').textContent='Connection failed; check key';$('saveKey').disabled=false};
function fps(){return Math.max(1,Number($('fps').value)||25)}function frame(){return Math.round(v.currentTime*fps())}function seekFrames(n){v.pause();v.currentTime=Math.max(0,Math.min(Number.isFinite(v.duration)?v.duration:Infinity,(frame()+n)/fps()))}for(const [id,n] of [['minus5',-5],['minus1',-1],['plus1',1],['plus5',5]])$(id).onclick=()=>seekFrames(n);$('play').onclick=()=>v.play().catch(()=>{});$('stop').onclick=()=>v.pause();$('frame').onchange=()=>{v.pause();v.currentTime=Math.max(0,Number($('frame').value)||0)/fps()};function sync(){if(document.activeElement!==$('frame'))$('frame').value=frame();const t=v.currentTime||0;$('clock').textContent=Math.floor(t/60)+':'+(t%60).toFixed(3).padStart(6,'0')}v.addEventListener('timeupdate',sync);v.addEventListener('seeked',sync);
$('saveName').onclick=async()=>{if(!path)return;const name=$('renameInput').value.trim();if(!/^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,150}\.mp4$/i.test(name)){$('renameStatus').textContent='Use a valid .mp4 filename';return}try{const d=await api('/api/rename',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({from:path,name})});path=d.path;$('fileName').textContent=name;$('renameStatus').textContent='Saved';await load()}catch(e){$('renameStatus').textContent='Rename failed: '+e.message}};
$('download').onclick=async()=>{if(!path)return;try{const d=await api('/api/playback?path='+encodeURIComponent(path));const a=document.createElement('a');a.href=d.url;a.download=path.split('/').pop();a.target='_blank';a.rel='noopener';document.body.append(a);a.click();a.remove()}catch(e){$('message').textContent=e.message}};
$('upload').onclick=async()=>{const f=$('file').files[0];if(!f||!connected)return $('uploadStatus').textContent='Select an MP4 and connect';if(f.size>140*1048576)return $('uploadStatus').textContent='140 MB maximum';$('upload').disabled=true;$('uploadStatus').textContent='Uploading…';try{await api('/api/upload',{method:'POST',headers:{'content-type':'application/octet-stream','x-asset-name':f.name.replace(/[^a-zA-Z0-9_.-]/g,'_')},body:f});$('uploadStatus').textContent='Uploaded';await load()}catch(e){$('uploadStatus').textContent=e.message}finally{$('upload').disabled=false}};
$('sx').onclick=()=>{if(!url)return $('message').textContent='Select a video';const u=new URL('../sxlock/index.html',location.href);u.searchParams.set('src',url);u.searchParams.set('name',path.split('/').pop());location.href=u.href};$('wav').onclick=()=>{$('message').textContent='WavLock requires audio extraction, not yet available';window.open('../wavlock/index.html','_blank')};signal(key?'busy':'offline');if(key)load();
</script></body></html>
