const API='https://gs-previewlock-api.onrender.com', $=x=>document.getElementById(x);let key=localStorage.getItem('gs_previewlock_key')||'',path='',url='',request=null,connected=false;let libraryFiles=[],libraryView=localStorage.getItem('previewlock_view')||'list';const thumbnailCache=new Map();const thumbQueue=[];let thumbActive=0;const v=$('player');
function signal(mode){$('dot').className='dot '+(mode==='online'?'green':mode==='offline'?'red':'');$('toggle').innerHTML=mode==='online'?'<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2v10"/><path d="M6.2 5.8a9 9 0 1 0 11.6 0"/></svg>':mode==='offline'?'<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2 6"/><path d="M20 4v7h-7"/></svg>':'<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 5l14 14M19 5 5 19"/></svg>';$('toggle').title=mode==='online'?'Disconnect':mode==='offline'?'Connect':'Cancel';$('toggle').setAttribute('aria-label',$('toggle').title)}
async function api(endpoint,opt={}){const r=await fetch(API+endpoint,{...opt,headers:{Authorization:'Bearer '+key,...opt.headers},signal:opt.signal});const data=await r.json();if(!r.ok)throw Error(data.error||'HTTP '+r.status);return data}
async function load(){if(!key){signal('offline');$('message').textContent='Open Settings to connect.';return}request=new AbortController();signal('busy');$('message').textContent='Loading…';try{const data=await api('/api/assets',{signal:request.signal});if(!key)return;connected=true;signal('online');libraryFiles=(data.entries||[]).filter(f=>f['.tag']==='file'&&/\.mp4$/i.test(f.name));renderLibrary();$('message').textContent=libraryFiles.length?'':'No MP4 files';}catch(e){if(e.name==='AbortError')return;connected=false;signal('offline');$('message').textContent='Connection failed: '+e.message}finally{request=null}}
function renderLibrary(){const files=[...libraryFiles],mode=$('sort').value;files.sort((a,b)=>mode==='name'?a.name.localeCompare(b.name,undefined,{numeric:true}):mode==='name-desc'?b.name.localeCompare(a.name,undefined,{numeric:true}):mode==='newest'?Date.parse(b.server_modified||0)-Date.parse(a.server_modified||0):mode==='oldest'?Date.parse(a.server_modified||0)-Date.parse(b.server_modified||0):mode==='largest'?(b.size||0)-(a.size||0):(a.size||0)-(b.size||0));$('count').textContent='· '+files.length;$('list').className=libraryView==='grid'?'gridView':'listView';$('view').textContent=libraryView==='grid'?'☷':'▦';$('list').replaceChildren();for(const f of files){const row=document.createElement('article'),name=document.createElement('span'),b=document.createElement('button');name.textContent=f.name;name.className='assetName';name.title='Tap to rename · hold to duplicate';name.setAttribute('role','button');name.tabIndex=0;let holdTimer=null,held=false,startX=0,startY=0;const cancelHold=()=>{clearTimeout(holdTimer);holdTimer=null};name.addEventListener('pointerdown',e=>{held=false;startX=e.clientX;startY=e.clientY;cancelHold();holdTimer=setTimeout(()=>{held=true;editAsset(f,'duplicate')},650)});name.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-startX)>12||Math.abs(e.clientY-startY)>12)cancelHold()});name.addEventListener('pointerup',cancelHold);name.addEventListener('pointercancel',cancelHold);name.addEventListener('contextmenu',e=>{e.preventDefault();cancelHold();held=true;editAsset(f,'duplicate')});name.onclick=()=>{if(!held)editAsset(f,'rename');held=false};name.onkeydown=e=>{if(e.key==='Enter')editAsset(f,'rename')};b.textContent='▶';b.setAttribute('aria-label','Play '+f.name);b.onclick=()=>toggleAsset(f);const meta=document.createElement('small');meta.className='assetMeta';meta.textContent=((f.size||0)/1048576).toFixed(1)+' MB · '+(f.server_modified?new Date(f.server_modified).toLocaleDateString():'');const info=document.createElement('div');info.className='assetInfo';info.append(name,meta);const thumb=document.createElement('div');thumb.className='videoThumb';thumb.textContent='▶';thumb.setAttribute('aria-label','Preview '+f.name);thumb.onclick=()=>toggleAsset(f);row.append(thumb,info,b);$('list').append(row);queueThumbnail(f,thumb)}}$('sort').onchange=renderLibrary;$('view').onclick=()=>{libraryView=libraryView==='grid'?'list':'grid';localStorage.setItem('previewlock_view',libraryView);renderLibrary()};
function applyThumb(el,item){el.style.aspectRatio=String(item.ratio);el.classList.toggle('portraitThumb',item.ratio<.85);el.classList.toggle('landscapeThumb',item.ratio>=.85);const img=document.createElement('img');img.src=item.src;img.alt='';el.replaceChildren(img)}
function queueThumbnail(f,el){const id=f.id||f.path_display;if(thumbnailCache.has(id)){const item=thumbnailCache.get(id);if(item){applyThumb(el,item)}return}thumbQueue.push({f,el,id});pumpThumbs()}
async function pumpThumbs(){if(thumbActive>=2||!thumbQueue.length)return;const job=thumbQueue.shift();thumbActive++;try{const d=await api('/api/playback?path='+encodeURIComponent(job.f.path_display));const video=document.createElement('video');video.preload='auto';video.muted=true;video.playsInline=true;video.crossOrigin='anonymous';video.src=d.url;const src=await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('timeout')),11000);let done=false;const finish=(error)=>{if(done)return;done=true;clearTimeout(timer);video.pause();video.removeAttribute('src');video.load();error?reject(error):resolve(result)};let result='';video.onloadedmetadata=()=>{try{video.currentTime=Math.min(1,Math.max(0,(video.duration||1)*.12))}catch(e){finish(e)}};video.onseeked=()=>{try{const canvas=document.createElement('canvas');const vw=video.videoWidth||160,vh=video.videoHeight||90,scale=Math.min(240/vw,240/vh),w=Math.max(1,Math.round(vw*scale)),h=Math.max(1,Math.round(vh*scale));canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(video,0,0,w,h);result={src:canvas.toDataURL('image/jpeg',.72),ratio:vw/vh};finish()}catch(e){finish(e)}};video.onerror=()=>finish(Error('video unavailable'))});thumbnailCache.set(job.id,src);if(job.el.isConnected)applyThumb(job.el,src)}catch(e){thumbnailCache.set(job.id,null);job.el.title='Preview unavailable'}finally{thumbActive--;pumpThumbs()}}
let editMode='rename',editPath='';function editAsset(f,mode){editMode=mode;editPath=f.path_display;$('renameSection').hidden=false;$('renameSection').querySelector('h2').textContent=mode==='duplicate'?'Duplicate video':'Rename video';$('renameInput').value=mode==='duplicate'?f.name.replace(/\.mp4$/i,'_copy.mp4'):f.name;$('saveName').textContent=mode==='duplicate'?'Duplicate':'Rename';$('renameStatus').textContent='';$('renameSection').scrollIntoView({behavior:'smooth',block:'nearest'});$('renameInput').focus();$('renameInput').select()}async function toggleAsset(f){if(path===f.path_display&&v.src){if(v.paused){v.play().catch(()=>{})}else v.pause();return}await select(f)}
async function select(f){path=f.path_display;$('fileName').textContent=f.name;$('download').disabled=false;try{$('fileName').textContent='Loading '+f.name+'…';const d=await api('/api/playback?path='+encodeURIComponent(path));url=d.url;v.src=url;$('fileName').textContent=f.name;v.play().catch(()=>{})}catch(e){$('fileName').textContent='Playback error: '+e.message}}
$('toggle').onclick=()=>{if(request){request.abort();request=null;signal('offline');$('message').textContent='Canceled';return}if(connected){connected=false;key='';localStorage.removeItem('gs_previewlock_key');v.pause();signal('offline');$('message').textContent='Disconnected';return}if(key)load();else{$('settings').open=true;$('editor').hidden=false;$('settingMessage').textContent='Enter setup key to connect.'}};
$('unlock').onclick=()=>{if(key){const check=prompt('Current setup key');if(check===null)return;if(check!==key){$('settingMessage').textContent='Incorrect key';return}}$('editor').hidden=false;$('settingMessage').textContent=''};
$('saveKey').onclick=async()=>{const candidate=$('keyInput').value.trim();if(!candidate)return;$('saveKey').disabled=true;key=candidate;await load();if(connected){localStorage.setItem('gs_previewlock_key',candidate);$('editor').hidden=true;$('settings').open=false;$('keyInput').value=''}else $('settingMessage').textContent='Connection failed; check key';$('saveKey').disabled=false};
function fps(){return 25}function frame(){return Math.round(v.currentTime*fps())}function seekFrames(n){v.pause();v.currentTime=Math.max(0,Math.min(Number.isFinite(v.duration)?v.duration:Infinity,(frame()+n)/fps()))}for(const [id,n] of [['minus5',-5],['minus1',-1],['plus1',1],['plus5',5]])$(id).onclick=()=>seekFrames(n);$('play').onclick=()=>v.play().catch(()=>{});$('stop').onclick=()=>v.pause();function sync(){$('frame').textContent=frame();const t=v.currentTime||0;$('clock').textContent=Math.floor(t/60)+':'+(t%60).toFixed(3).padStart(6,'0')}v.addEventListener('timeupdate',sync);v.addEventListener('seeked',sync);
$('saveName').onclick=async()=>{if(!editPath)return;const name=$('renameInput').value.trim();if(!/^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,150}\.mp4$/i.test(name)){$('renameStatus').textContent='Invalid .mp4 filename';return}const button=$('saveName');button.disabled=true;try{const d=await api(editMode==='duplicate'?'/api/duplicate':'/api/rename',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({from:editPath,name})});if(editMode==='rename'&&path===editPath){path=d.path;$('fileName').textContent=name}$('renameStatus').textContent=editMode==='duplicate'?'Duplicated':'Renamed';$('renameSection').hidden=true;await load()}catch(e){$('renameStatus').textContent=e.message}finally{button.disabled=false}};
$('download').onclick=async()=>{if(!path)return;try{const d=await api('/api/playback?path='+encodeURIComponent(path));const a=document.createElement('a');a.href=d.url;a.download=path.split('/').pop();a.target='_blank';a.rel='noopener';document.body.append(a);a.click();a.remove()}catch(e){$('message').textContent=e.message}};
const CHUNK=6*1024*1024;async function uploadOne(f){const name=f.name.replace(/[^a-zA-Z0-9_.-]/g,'_');if(!/^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,150}\.mp4$/i.test(name))throw Error('Invalid MP4 name: '+f.name);if(f.size<=140*1048576){await api('/api/upload',{method:'POST',headers:{'content-type':'application/octet-stream','x-asset-name':name},body:f});return}let offset=0,session='';while(offset<f.size){const end=Math.min(offset+CHUNK,f.size),phase=!session?'start':end===f.size?'finish':'append';const q=new URLSearchParams({phase,id:session,offset:String(offset),name});const d=await api('/api/upload-chunk?'+q,{method:'POST',headers:{'content-type':'application/octet-stream'},body:f.slice(offset,end)});if(phase==='start')session=d.id;offset=end;$('uploadStatus').textContent=name+' · '+Math.round(offset/f.size*100)+'%'}if(!session)throw Error('Upload session failed')}
$('upload').onclick=async()=>{const files=Array.from($('file').files);if(!files.length||!connected)return $('uploadStatus').textContent='Select MP4 files and connect';$('upload').disabled=true;let success=0;const errors=[];try{for(let i=0;i<files.length;i++){const f=files[i];$('uploadStatus').textContent='Uploading '+(i+1)+'/'+files.length+' · '+f.name;try{await uploadOne(f);success++}catch(e){errors.push(f.name+': '+e.message)}}if(success){$('file').value='';await load()}$('uploadStatus').textContent=success+' uploaded'+(errors.length?' · '+errors.join(' | '):'')}finally{$('upload').disabled=false}};
$('sx').onclick=()=>{if(!url)return $('message').textContent='Select a video';const u=new URL('../sxlock/index.html',location.href);u.searchParams.set('src',url);u.searchParams.set('name',path.split('/').pop());location.href=u.href};$('wav').onclick=()=>{$('message').textContent='WavLock requires audio extraction, not yet available';window.open('../wavlock/index.html','_blank')};signal(key?'busy':'offline');if(key)load();
