<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fireside Wolf Mixer v2.3</title><style>body{background:#111923;color:#f4f6f8;font:18px system-ui;max-width:740px;margin:auto;padding:14px}section{background:#203044;padding:14px;border-radius:12px;margin:12px 0}h1{font-size:25px}h2{font-size:20px}button,input{font-size:18px}button{padding:12px;margin:4px;border:1px solid #91a9bd;border-radius:8px;background:#34516b;color:white}input[type=range]{width:100%}input[type=file]{max-width:100%}video{width:100%;max-height:48vh;background:#000}label{display:block;margin:10px 0}.track{border-top:1px solid #63798b;padding:10px 0}.pair{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.pair input[type=number]{width:85px;font-size:18px}.muted{color:#c3d0dc;font-size:14px}</style></head><body><h1>Fireside Wolf Mixer v2.3</h1><p class="muted">Lightweight Android edition. No embedded audio or video. Load the original video and any of the three wolf files. Nothing auto-loads.</p><section><h2>Original Fireside video</h2><input type="file" id="videoFile" accept="video/*"><video id="video" controls playsinline preload="metadata"></video><p id="clock">Frame 0 · 0.000 s</p><button id="preview">Preview from 27s</button><button id="stop">Stop</button><label>Original soundtrack <output id="bedLabel">100%</output><input id="bed" type="range" min="0" max="100" value="100"></label></section><section><h2>Wolf layers</h2><div id="tracks"></div></section><section><button id="off">Mute all wolves</button><button id="save">Download cue settings</button><p id="status" class="muted">Solo Howl is the suggested starting call, at 15%.</p></section><script>
'use strict';const $=id=>document.getElementById(id),v=$('video'),fps=25;let videoUrl=null;const defs=[['Wolf_Calls.mp3',0,12],['Wolf_Call.mp3',0,12],['Solo_Howl.mp3',1,15]];const tracks=defs.map((d,i)=>{let div=document.createElement('div');div.className='track';div.innerHTML=`<h2>${i+1}. ${d[0]}</h2><input type="file" id="f${i}" accept="audio/*"><label><input type="checkbox" id="on${i}" ${d[1]?'checked':''}> Enable</label><label>Volume <output id="out${i}">${d[2]}%</output><input id="vol${i}" type="range" min="0" max="100" value="${d[2]}"></label><div class="pair"><label>Start frame <input id="start${i}" type="number" value="725" min="0"></label><label>Source offset (s) <input id="offset${i}" type="number" value="0" min="0" step="0.04"></label><label>Duration (s) <input id="dur${i}" type="number" value="6" min="0.1" step="0.04"></label></div><div class="pair"><label>Fade in (s) <input id="fi${i}" type="number" value="0.2" min="0" step="0.05"></label><label>Fade out (s) <input id="fo${i}" type="number" value="0.6" min="0" step="0.05"></label></div>`;$('tracks').append(div);let a=new Audio();a.preload='metadata';let url=null;$( `f${i}`).addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);a.src=url;a.load();$('status').textContent='Loaded '+f.name});return {a,ready:()=>!!url,stop:()=>{a.pause();}}});
const n=id=>Number($(id).value)||0;let active=false;function update(){let t=v.currentTime||0;$('clock').textContent='Frame '+Math.floor(t*fps)+' · '+t.toFixed(3)+' s';v.volume=n('bed')/100;$('bedLabel').textContent=n('bed')+'%';tracks.forEach((tr,i)=>{let a=tr.a,start=n('start'+i)/fps,delta=t-start,dur=n('dur'+i),on=$('on'+i).checked,inside=delta>=0&&delta<dur,fi=n('fi'+i),fo=n('fo'+i);$('out'+i).textContent=n('vol'+i)+'%';let env=inside?Math.max(0,Math.min(1,fi?delta/fi:1,fo?(dur-delta)/fo:1)):0;a.volume=on?n('vol'+i)/100*env:0;if(!tr.ready()||v.paused||!on||!inside||a.volume===0){if(!a.paused)a.pause();return}let desired=n('offset'+i)+delta;if(Number.isFinite(a.duration)&&desired>=a.duration){a.pause();return}if(a.paused){try{a.currentTime=desired}catch(e){}a.play().catch(()=>{});}else if(Math.abs(a.currentTime-desired)>0.75){try{a.currentTime=desired}catch(e){}}});}
let timer=null;function startTick(){if(timer)return;timer=setInterval(update,160)}function stopTick(){if(timer){clearInterval(timer);timer=null}tracks.forEach(t=>t.stop());update()}v.addEventListener('play',startTick);v.addEventListener('pause',stopTick);v.addEventListener('ended',stopTick);v.addEventListener('seeked',update);v.addEventListener('timeupdate',()=>{if(!timer)update()});$('videoFile').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;stopTick();if(videoUrl)URL.revokeObjectURL(videoUrl);videoUrl=URL.createObjectURL(f);v.src=videoUrl;v.load();$('status').textContent='Loaded '+f.name});$('preview').onclick=()=>{if(!videoUrl){$('status').textContent='Select original 15713.mp4 first';return}v.currentTime=27;v.play().catch(e=>$('status').textContent=e.message)};$('stop').onclick=()=>{v.pause();v.currentTime=0;stopTick()};$('off').onclick=()=>{tracks.forEach((t,i)=>{$('on'+i).checked=false;t.stop()});update()};$('save').onclick=()=>{let c={fps,videoVolume:n('bed'),tracks:tracks.map((t,i)=>({file:defs[i][0],enabled:$('on'+i).checked,volume:n('vol'+i),startFrame:n('start'+i),offset:n('offset'+i),duration:n('dur'+i),fadeIn:n('fi'+i),fadeOut:n('fo'+i)}))};let u=URL.createObjectURL(new Blob([JSON.stringify(c,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='GS_FIRESIDE_WOLF_CUE_v2.3.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};update();window.toolsHubState=()=>({tool:'Audio cue mixer',version:'2.3+hub.1',video:document.getElementById('videoFile').files[0]?.name||null,fps,videoVolume:n('bed'),tracks:tracks.map((t,i)=>({file:document.getElementById('f'+i).files[0]?.name||defs[i][0],enabled:document.getElementById('on'+i).checked,volume:n('vol'+i),startFrame:n('start'+i),offset:n('offset'+i),duration:n('dur'+i),fadeIn:n('fi'+i),fadeOut:n('fo'+i)}))});</script><script src="../../shared/tool-bridge.js?v=1.0"></script></body></html>
