<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GS Field Guide · Graphic Cluster</title><style>body{font:16px system-ui;background:#111b16;color:#f7ead1;max-width:680px;margin:auto;padding:18px}h2{margin-bottom:5px}label{display:block;margin:12px 0}input{width:100%;font:inherit;padding:10px;box-sizing:border-box;border-radius:5px;border:1px solid #b3b3b3}button{padding:12px;font:inherit;background:#e7b75c;border:0;border-radius:7px;font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#253129;padding:12px}small{color:#c8bea9}</style><h2>Field Guide · FG-01</h2><p>Enter the thought cluster and frame cues. The approved reference is loaded from global assets automatically.</p><div id="words"></div><label>Exit frame<input id="exit" type="number" value="231"></label><button id="check">Check status</button> <button id="generate">Generate graphic once</button><p><small>One authorized test. No automatic retries. This version will report if the approved global master has not yet been registered.</small></p><pre id="result">Ready.</pre><script>
const words=['SUFFERING','while','FIGHTING','over','CLAIMS'],frames=[115,144,160,188,209],container=document.getElementById('words');
words.forEach((w,i)=>{const l=document.createElement('label');l.textContent='Element '+(i+1);const x=document.createElement('input');x.id='w'+i;x.value=w;const f=document.createElement('input');f.id='f'+i;f.type='number';f.value=frames[i];f.setAttribute('aria-label','Start frame for '+w);l.append(x,f);container.append(l)});
const endpoint='https://gs-previewlock-api.onrender.com/api/fieldguide/fg01',out=document.getElementById('result');
document.getElementById('check').onclick=async()=>{try{const r=await fetch(endpoint);out.textContent=JSON.stringify(await r.json(),null,2)}catch(e){out.textContent=e.message}};
document.getElementById('generate').onclick=async()=>{const cluster=words.map((_,i)=>document.getElementById('w'+i).value.trim()),cues=frames.map((_,i)=>Number(document.getElementById('f'+i).value));cues.push(Number(document.getElementById('exit').value));if(cluster.some(x=>!x)||cues.some(x=>!Number.isInteger(x))){out.textContent='Complete all words and frame numbers';return}if(!confirm('Submit the single authorized FG-01 Gemini request? No automatic retry.'))return;document.getElementById('generate').disabled=true;try{const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({job:'GS-FG01-GEMINI-ONE-USD-20261112',preset:'FG-01',cluster,frames:cues})});out.textContent=JSON.stringify(await r.json(),null,2)}catch(e){out.textContent='Unknown submission status. Do not retry: '+e.message}};
</script></html>
