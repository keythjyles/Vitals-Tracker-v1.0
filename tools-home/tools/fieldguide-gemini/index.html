<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GS Field Guide · GS-TOOL-FIELDGUIDE-GEMINI · R1</title>
  <style>
    body { font: 16px system-ui; background: #111b16; color: #f7ead1; max-width: 680px; margin: auto; padding: 18px; }
    h1 { font-size: 1.6rem; margin-bottom: .25rem; }
    .identity { color: #c8bea9; margin-top: 0; }
    label { display: block; margin: 12px 0; }
    input { width: 100%; font: inherit; padding: 10px; box-sizing: border-box; border-radius: 5px; border: 1px solid #b3b3b3; }
    button { padding: 12px; font: inherit; background: #e7b75c; border: 0; border-radius: 7px; font-weight: 700; color: #111b16; }
    button:disabled { opacity: .75; }
    a { color: #f5d28e; }
    #result { background: #253129; padding: 12px; }
  </style>
</head>
<body>
  <h1>GS Field Guide · FG-01</h1>
  <p class="identity">GS-TOOL-FIELDGUIDE-GEMINI · R1</p>
  <div id="words"></div>
  <label>Exit frame<input id="exit" type="number" value="231" readonly></label>
  <button id="check" type="button">Check test status</button>
  <p id="result" role="status" aria-live="polite">Checking the FG-01 test.</p>
  <p><a href="https://gs-previewlock-api.onrender.com/oauth/google/status">Check private Drive connection</a></p>
  <script>
    const words = ['SUFFERING', 'while', 'FIGHTING', 'over', 'CLAIMS'];
    const frames = [115, 144, 160, 188, 209];
    const container = document.getElementById('words');
    words.forEach((word, index) => {
      const label = document.createElement('label');
      const text = document.createElement('input');
      const frame = document.createElement('input');
      label.textContent = 'Element ' + (index + 1);
      text.value = word;
      text.readOnly = true;
      text.setAttribute('aria-label', 'Text for element ' + (index + 1));
      frame.type = 'number';
      frame.value = frames[index];
      frame.readOnly = true;
      frame.setAttribute('aria-label', 'Start frame for element ' + (index + 1));
      label.append(text, frame);
      container.append(label);
    });
    const button = document.getElementById('check');
    const result = document.getElementById('result');
    async function checkStatus() {
      button.disabled = true;
      try {
        const response = await fetch('https://gs-previewlock-api.onrender.com/api/fieldguide/fg01', { cache: 'no-store' });
        if (!response.ok) throw Error();
        const status = await response.json();
        if (status.state === 'closed' && status.providerStatus === 429) {
          result.textContent = 'Test closed. Gemini returned HTTP 429 and produced no image.';
        } else if (status.state === 'closed' && status.imageProduced) {
          result.textContent = 'Test complete. The image is saved in private Drive.';
        } else if (status.state === 'closed') {
          result.textContent = 'The FG-01 test is closed. Check the private receipt for the outcome.';
        } else {
          result.textContent = 'The FG-01 test is submitted by the operator.';
        }
      } catch {
        result.textContent = 'Could not load the FG-01 test status. Try Check test status again.';
      } finally {
        button.disabled = false;
      }
    }
    button.addEventListener('click', checkStatus);
    checkStatus();
  </script>
</body>
</html>
