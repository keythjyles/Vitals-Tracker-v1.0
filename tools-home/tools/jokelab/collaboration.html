<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GS · Pebble collaboration</title>
<style>body{margin:0;background:#101713;color:#edf3ed;font:17px system-ui;line-height:1.45}main{max-width:760px;margin:auto;padding:12px}nav{display:flex;justify-content:space-between;gap:8px;align-items:center}a{color:#c1df93}button{font:inherit;background:#c1df93;color:#142114;border:0;border-radius:6px;padding:10px 16px}h1{font-size:24px;margin:18px 0 4px}h2{font-size:19px}p{margin:8px 0}video{display:block;width:min(100%,280px);max-height:50vh;margin:14px auto;background:black}article{border-top:1px solid #425748;padding:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;margin:8px 0}.muted{color:#bac6bc}.tag{color:#c1df93}details{margin:8px 0}</style>
<main><nav><a href="./">← JokeLab</a><button id="refresh">Refresh</button></nav><h1>Pebble · AI collaboration</h1><p id="status" role="status">Loading recorded project…</p><p class="muted">Existing approved speaking master</p><video controls playsinline preload="metadata" src="../jokelets/media/GS_Jokelet_Pebble_Straight_Stare_v01.mp4"></video><p id="budget"></p><p class="muted">Updates every 15 seconds while open.</p><section id="events"></section></main>
<script type="module">
const $=id=>document.getElementById(id);const API='https://gs-previewlock-api.onrender.com';
function render(project,source){$('events').replaceChildren();$('status').textContent=source+' · '+project.state;$('budget').textContent='$5 total cap · $'+Number(project.reservedUsd||0).toFixed(2)+' reserved · actual charges '+(project.actualChargeUsd==null?'not yet reconciled':'$'+Number(project.actualChargeUsd).toFixed(2));for(const event of project.transcript||[]){const a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('pre');h.textContent=event.author+' · '+event.stage;p.textContent=event.text;a.append(h,p);$('events').append(a)}}
let loading=false;async function load(){if(loading)return;loading=true;const b=$('refresh');b.disabled=true;try{const r=await fetch('runs/GS-GEMINI-20261029-01.project.json',{cache:'no-store'});if(!r.ok)throw Error('Project checkpoint unavailable');const saved=await r.json();render(saved,'Saved checkpoint');const seen=new Set((saved.transcript||[]).map(e=>e.providerEventId).filter(Boolean));const key=localStorage.getItem('gs_previewlock_key');if(key){const r=await fetch(API+'/api/gemini-experiment',{headers:{authorization:'Bearer '+key}});if(!r.ok)throw Error('Live discussion unavailable; saved checkpoint retained');const d=await r.json();const p=d.experiment;if(p){$('status').textContent='Live saved discussion · '+(p.events.at(-1)?.state||'ready');$('budget').textContent='$5 cap · $'+p.events.reduce((s,e)=>s+e.reservedUsd,0).toFixed(2)+' reserved · actual charges not yet reconciled';for(const e of p.events){if(seen.has(e.id))continue;const a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('pre');h.textContent='Gemini · '+e.id+' · '+e.state;p.textContent=e.response||e.providerErrorMessage||e.error||'Request recorded; waiting for result';a.append(h,p);$('events').append(a)}}}}catch(e){$('status').textContent=e.message}finally{b.disabled=false;loading=false}}
$('refresh').onclick=load;load();const observer=setInterval(()=>{if(!document.hidden)load()},15000);window.addEventListener('pagehide',()=>clearInterval(observer));
</script></html>
