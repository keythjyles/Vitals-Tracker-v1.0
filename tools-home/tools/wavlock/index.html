<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WavLock · GS-TOOL-WAVLOCK · R1.8</title>
<link rel="stylesheet" href="../../shared/player-shell.css?v=34">
<link rel="stylesheet" href="./wavlock.css?v=1.8">
<script src="../../shared/audio-tool-nav.js?v=1" defer></script>
<script type="module" src="./wavlock.mjs?v=1.8"></script>
</head>
<body>
<main>
  <h1>WavLock · GS-TOOL-WAVLOCK · R1.8</h1>
  <section id="audioEditor" aria-label="Audio editor">
    <button id="fileGrip" type="button" aria-label="Show file picker" aria-expanded="false" aria-controls="audioPicker">⌄</button>
    <div id="audioPicker" class="audio-picker" hidden>
      <label for="file">Device audio</label>
      <input id="file" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.flac,.ogg,.opus">
    </div>
    <audio id="audio" preload="metadata"></audio>
    <div id="waveView" class="wave-view">
      <canvas id="wave" role="img" aria-label="Audio waveform. Tap to seek. Pinch to zoom."></canvas>
      <div id="waveSelection" class="wave-selection" hidden></div>
      <div id="wavePlayhead" class="wave-playhead" hidden></div>
      <div id="waveAxis" class="wave-axis" aria-hidden="true" hidden><span id="waveFrom"></span><span id="waveTo"></span></div>
      <button id="openAudio" type="button">Open audio file</button>
    </div>
    <div class="audio-reference">
      <span id="source" aria-label="Source filename">No file loaded</span>
      <span id="clock">00:00.000 / 00:00.000</span>
    </div>
    <fieldset id="editControls" aria-label="Audio controls" disabled>
      <div class="audio-transport">
        <button id="start" type="button" title="Go to the start and pause">Start</button>
        <button id="play" type="button" aria-label="Play / Pause">Play</button>
        <button id="prev" type="button">−0.1s</button>
        <button id="next" type="button">+0.1s</button>
        <button id="preview" type="button" title="Play selection">Play cut</button>
      </div>
      <div class="audio-marks">
        <div>
          <button id="markIn" type="button" aria-label="Mark IN">IN</button>
          <input id="in" type="number" aria-label="IN seconds" inputmode="decimal" min="0" step=".001" value="0">
        </div>
        <div>
          <button id="markOut" type="button" aria-label="Mark OUT">OUT</button>
          <input id="out" type="number" aria-label="OUT seconds" inputmode="decimal" min="0" step=".001" value="0">
        </div>
        <button id="fitWave" type="button" title="Fit the full waveform">Fit</button>
      </div>
      <div class="audio-save">
        <input id="name" type="text" autocomplete="off" aria-label="Clip name" placeholder="Clip name" maxlength="120">
        <button id="export" type="button">Save WAV</button>
        <button id="clearSelection" type="button" title="Start a new cut">New cut</button>
      </div>
      <details id="audioMore">
        <summary>More controls</summary>
        <div class="audio-transport audio-secondary">
          <button id="goIn" type="button">Go IN</button>
          <button id="goOut" type="button">Go OUT</button>
          <button id="reset" type="button">Reset editor</button>
        </div>
        <div class="audio-jump">
          <input id="jumpTime" type="number" aria-label="Go to seconds" inputmode="decimal" min="0" step=".001" placeholder="Seconds">
          <button id="goTime" type="button">Go</button>
        </div>
      </details>
    </fieldset>
    <p id="status" role="status"></p>
  </section>
  <div id="scribeActions"></div>
  <details id="editorScribe"><summary>Scribe</summary></details>
  <section id="savedClips" aria-labelledby="savedClipsTitle">
    <h2 id="savedClipsTitle">Saved clips</h2>
    <p id="clipStatus" role="status"></p>
    <ul id="clipList"></ul>
  </section>
  <details id="wavlockEffects">
    <summary>Approved effects <span id="approvedCount" hidden></span></summary>
    <input id="approvedSearch" type="search" aria-label="Find approved effects" placeholder="Find approved effects">
    <div id="approvedList"></div>
    <p id="approvedStatus" role="status"></p>
  </details>
  <nav class="audio-tool-nav" aria-label="Audio tools" data-audio-tool="wavlock">
    <a href="../sxlock/" target="gs-audio-sxlock">SxLock</a>
    <a href="../sound-scrubber/" target="gs-audio-sound-scrubber">Sound Scrubber</a>
    <a href="../../" target="gs-audio-tools">Tools</a>
  </nav>
</main>
</body>
</html>
