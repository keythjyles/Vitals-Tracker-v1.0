name: SxLock media regression
on:
  pull_request:
    paths: ['tools-home/tools/sxlock/**', '.github/workflows/sxlock-media-regression.yml']
  push:
    paths: ['tools-home/tools/sxlock/**', '.github/workflows/sxlock-media-regression.yml']
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3
      - run: npm install --prefix /tmp/sx-browser --no-audit --no-fund playwright@1.62.1
      - run: node /tmp/sx-browser/node_modules/playwright/cli.js install --with-deps chromium
      - run: node --test tools-home/tools/sxlock/mp4-duration.test.cjs tools-home/services/previewlock-api/*.test.mjs
      - run: python tools-home/tools/sxlock/tests/make_fixtures.py /tmp/sx-media
      - run: node tools-home/tools/sxlock/tests/media-regression.cjs
        env:
          DATA_DIR: /tmp/sx-media
          PLAYWRIGHT_MODULE: /tmp/sx-browser/node_modules/playwright
      - run: node tools-home/tools/sxlock/tests/library-playhead.cjs
        env:
          DATA_DIR: /tmp/sx-media
          PLAYWRIGHT_MODULE: /tmp/sx-browser/node_modules/playwright
      - run: python tools-home/tools/sxlock/tests/measure_regression.py /tmp/sx-media
