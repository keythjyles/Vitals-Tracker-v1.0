name: GS Studio checks
on:
  push:
    paths: ['tools-home/tools/studio/**','tools-home/tools/jokelab/**','tools-home/source/app/workbench.tsx','tools-home/source/app/joke-library.tsx','tools-home/tools/caplock/**','tools-home/tools/cliplock/**','tools-home/tools/aspectlock/**','tools-home/tools/sxlock/**','tools-home/tools/previewlock/**','tools-home/services/previewlock-api/**','.github/workflows/studio-checks.yml']
  pull_request:
    paths: ['tools-home/tools/studio/**','tools-home/services/previewlock-api/**','.github/workflows/studio-checks.yml']
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: npm install --prefix /tmp/studio-browser --no-audit --no-fund playwright@1.62.1
      - run: node /tmp/studio-browser/node_modules/playwright/cli.js install --with-deps chromium
      - run: node --test tools-home/tools/studio/tests/*.test.mjs tools-home/services/previewlock-api/studio.test.mjs
      - run: |
          python3 -m http.server 8768 --bind 127.0.0.1 >/tmp/studio-server.log 2>&1 &
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail --silent http://127.0.0.1:8768/tools-home/tools/studio/ >/dev/null
          node tools-home/tools/studio/tests/browser.cjs
        env:
          PLAYWRIGHT_MODULE: /tmp/studio-browser/node_modules/playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gs-studio-browser-proof
          path: /tmp/gs-studio-r1-browser.png
