name: ClipLock cutter checks
on:
  push:
    paths: ['tools-home/tools/cliplock/**', 'tools-home/tools/caplock/**', 'tools-home/tools/sxlock/**', 'tools-home/services/previewlock-api/**', 'tools-home/shared/**', 'tools-home/tools/studio/project-index.mjs', 'tools-home/tools/studio/project-picker.mjs', '.github/workflows/cliplock-checks.yml']
  pull_request:
    paths: ['tools-home/tools/cliplock/**', 'tools-home/tools/caplock/**', 'tools-home/tools/sxlock/**', 'tools-home/services/previewlock-api/**', 'tools-home/shared/**', 'tools-home/tools/studio/project-index.mjs', 'tools-home/tools/studio/project-picker.mjs', '.github/workflows/cliplock-checks.yml']
permissions:
  contents: read
jobs:
  clipper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools-home/tools/cliplock
            tools-home/services/previewlock-api
            tools-home/shared
            tools-home/tools/studio
            tools-home/tools/sxlock
            tools-home/tools/caplock
            tools-home/tools/aspectlock
            tools-home/tools/previewlock
            tools-home/tools/framelock
            tools-home/tools/motionlock
            tools-home/tools/wavlock
            tools-home/tools/jokelab
            tools-home/tools/jokelets
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - run: npm install --prefix /tmp/clip-browser --no-audit --no-fund playwright@1.62.1
      - run: node /tmp/clip-browser/node_modules/playwright/cli.js install --with-deps chromium
      - run: node --test tools-home/shared/tests/*.test.mjs tools-home/tools/cliplock/tests/*.test.mjs tools-home/services/previewlock-api/joke-project.test.mjs tools-home/services/previewlock-api/cut-jokelets.test.mjs tools-home/services/previewlock-api/production-stages.test.mjs
      - run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/clip-server.log 2>&1 &
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail --silent http://127.0.0.1:8767/tools-home/tools/cliplock/ >/dev/null
          node tools-home/tools/cliplock/tests/browser.cjs
        env:
          PLAYWRIGHT_MODULE: /tmp/clip-browser/node_modules/playwright


      - name: Finished-video cutter regression
        run: node tools-home/tools/cliplock/tests/video-browser.cjs
        env:
          PLAYWRIGHT_MODULE: /tmp/clip-browser/node_modules/playwright
      - name: Single-joke caption-to-sound production route
        timeout-minutes: 5
        run: node tools-home/tools/cliplock/tests/jokelet-browser.cjs
        env:
          PLAYWRIGHT_MODULE: /tmp/clip-browser/node_modules/playwright
      - name: Locked compact player geometry
        run: node tools-home/shared/tests/compact-player.cjs
        env:
          PLAYWRIGHT_MODULE: /tmp/clip-browser/node_modules/playwright
      - name: Keep production-route proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jokelet-production-stage-proof
          path: |
            /tmp/jokelet-projects-browser.png
            /tmp/jokelet-projects-check/composite.mp4
            /tmp/jokelet-projects-check/finished-jokelet.mp4
