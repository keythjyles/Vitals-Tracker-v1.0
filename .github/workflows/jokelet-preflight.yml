name: Jokelet authenticated voice preflight
on:
  push:
    branches: [main]
    paths: ['tools-home/tools/jokelab/requests/voice-preflight.json']
permissions: {}
concurrency:
  group: jokelet-readonly-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Run and preserve read-only production job
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --max-time 30 "https://raw.githubusercontent.com/keythjyles/Vitals-Tracker-v1.0/${GITHUB_SHA}/tools-home/services/jokelet-api/github-job.py" -o github-job.py
          python3 github-job.py
      - name: Preserve credential-free recovery artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jokelet-preflight
          path: jokelet-*.json
          retention-days: 30
          if-no-files-found: error
